          -
            value: 'Vernetzen, forschen und lernen'
        field_field_cta_secondary:
          -
            value: '<p>Sie möchten Ihr Wissen vertiefen? Das SODa-Projekt bietet ergänzend <a href="https://sammlungen.io/kb">Lernmaterialien und Vermittlungsangebote zum Forschungsdatenmanagement</a> an.</p>'
