            field_cta_description:
              -
                value: 'The Semantic Co-Working Space (SCS) provides infrastructure and applications that support collaborative work across different stages of the data lifecycle. Designed especially for scientific collections, it offers an environment to explore new tools, work together, and improve data literacy through hands-on experience.'
