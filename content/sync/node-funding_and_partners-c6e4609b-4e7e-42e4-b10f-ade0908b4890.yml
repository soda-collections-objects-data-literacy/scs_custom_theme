      value: '<p>It is designed for people&nbsp;who work with scientific university collections. To use the Semantic Co-Working Space, you need to&nbsp;<a href="https://scs.sammlungen.io/de/user/register">register</a>&nbsp;for a new account. Access to all applications and instances is managed for each user via&nbsp;Single-Sign-On (SSO)&nbsp;using a Keycloak account.&nbsp;</p>'
