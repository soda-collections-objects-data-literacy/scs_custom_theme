              value: '<p><strong>Interessengemeinschaft für Semantische Datenverarbeitung e.V.</strong><br>Irisstr. 23a<br>80935 München</p><p>Vereinsregister: VR 201583<br>Registergericht: Amtsgericht Nürnberg</p><p><strong>Vertreten durch:</strong><br>Georg Hohmann</p><h2>Kontakt</h2><p>E-Mail: <a href="vorstand@igsd-ev.de">vorstand@igsd-ev.de</a></p><h2>Redaktionell verantwortlich</h2><p>Robert Nasarek<br>Kornmarkt 1<br>90409 Nürnberg</p><p>Quelle: Erstellt mit dem Impressum-Generator von <a href="https://www.e-recht24.de">https://www.e-recht24.de</a></p><hr><h2>Rechtliche Hinweise</h2><h3>Haftung für Inhalte</h3><p>Die Inhalte dieser Website werden mit größtmöglicher Sorgfalt erstellt. Die Interessengemeinschaft für Semantische Datenverarbeitung e. V. (nachfolgend „Anbieter“) übernimmt jedoch keine Gewähr für die Richtigkeit, Vollständigkeit und Aktualität der bereitgestellten Inhalte. Die Nutzung der abrufbaren Inhalte erfolgt auf eigene Gefahr des Nutzers.</p><p>Allein durch den Aufruf dieser frei zugänglichen Website kommt kein Vertragsverhältnis zwischen dem Nutzer und dem Anbieter zustande. Für die Nutzung der digitalen Forschungs- und Arbeitsumgebung (Login-Bereich) gelten vorrangig die gesonderten <strong>Nutzungsbedingungen</strong>.</p><h3>Haftung für externe Links</h3><p>Diese Website enthält Verknüpfungen zu Websites Dritter („externe Links“). Diese Websites unterliegen der Haftung der jeweiligen Betreiber. Der Anbieter hat bei der erstmaligen Verknüpfung der externen Links die fremden Inhalte auf etwaige Rechtsverstöße überprüft. Zu dem Zeitpunkt waren keine Rechtsverstöße ersichtlich. Der Anbieter hat keinerlei Einfluss auf die aktuelle und zukünftige Gestaltung und auf die Inhalte der verknüpften Seiten. Das Setzen von externen Links bedeutet nicht, dass sich der Anbieter die hinter dem Verweis oder Link liegenden Inhalte zu eigen macht.</p><p>&nbsp;</p><p>Stand: 01. Juni 2026</p>'
