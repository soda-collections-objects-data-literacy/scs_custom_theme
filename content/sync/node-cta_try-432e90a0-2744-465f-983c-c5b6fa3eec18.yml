      value: 'Der Semantic Co-Working Space (SCS) stellt Anwendungen und die technische Infrastruktur für die kollaborative Arbeit entlang des Datenlebenszyklus bereit. Konzipiert insbesondere für wissenschaftliche Sammlungen, ermöglicht er es, Werkzeuge praktisch zu erproben, zusammenzuarbeiten und Datenkompetenzen durch praktische Erfahrung zu stärken.'
