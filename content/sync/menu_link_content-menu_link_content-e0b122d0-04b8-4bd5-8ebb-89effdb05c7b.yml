              value: '<p>Die Interessengemeinschaft für Semantische Datenverarbeitung e. V. (nachfolgend „Anbieter“) stellt eine webbasierte digitale Forschungs- und Arbeitsumgebung („Dienst“) bereit. Für die Nutzung des Dienstes gelten die nachfolgenden Nutzungsbedingungen.</p><p><strong>§ 1 Gegenstand des Dienstes</strong></p><p>(1) Der Anbieter stellt den Dienst für wissenschaftliche und forschungsbezogene Zwecke bereit.</p><p>(2) Die Nutzung des Dienstes erfolgt unentgeltlich. Ein Anspruch auf die dauerhafte Bereitstellung des Dienstes besteht nicht.</p><p>(3) Der Dienst kann aus mehreren technischen Komponenten und Drittanwendungen bestehen, die zur Bereitstellung einzelner Funktionen miteinander interagieren. Im Rahmen der Nutzung können Daten zwischen diesen Komponenten verarbeitet werden, soweit dies technisch erforderlich ist.</p><p>(4) Der Dienst dient insbesondere der wissenschaftlichen Verarbeitung, Verwaltung und gegebenenfalls Veröffentlichung strukturierter Forschungsdaten und Linked Open Data.</p><p>(5) Ein Anspruch auf die Bereitstellung bestimmter Funktionen oder Komponenten besteht nicht.</p><p><strong>§ 2 Zugang und Nutzung</strong></p><p>(1) Die Nutzung des Dienstes kann eine Registrierung oder Authentifizierung über ein zentrales Zugangssystem erfordern.</p><p>(2) Nutzer sind verpflichtet, Zugangsdaten geheim zu halten und vor dem Zugriff Dritter zu schützen.</p><p>(3) Der Anbieter ist berechtigt, den Zugang vorübergehend oder dauerhaft einzuschränken oder zu sperren, sofern dies aus technischen, organisatorischen oder sicherheitsbezogenen Gründen erforderlich ist oder Anhaltspunkte für eine missbräuchliche oder rechtswidrige Nutzung vorliegen.</p><p><strong>§ 3 Zulässige Nutzung</strong></p><p>(1) Der Dienst darf ausschließlich für wissenschaftliche, Forschungs- und Dokumentationszwecke genutzt werden.</p><p>(2) Unzulässig ist insbesondere jede Nutzung, die die Stabilität, Sicherheit oder Verfügbarkeit des Dienstes beeinträchtigen kann oder gegen geltendes Recht verstößt.</p><p>(3) Der Anbieter ist berechtigt, zur Sicherstellung eines ordnungsgemäßen Betriebs technische Nutzungsbeschränkungen einzuführen oder anzupassen.</p><p><strong>§ 4 Inhalte, Veröffentlichungen und Datenverarbeitung</strong></p><p>(1) Nutzer bleiben, soweit gesetzlich zulässig, Inhaber der Rechte an den von ihnen eingebrachten Inhalten.</p><p>(2) Nutzer sichern zu, dass von ihnen eingebrachte Inhalte keine Rechte Dritter verletzen und geltende gesetzliche Vorschriften eingehalten werden.</p><p>(3) Soweit Nutzer personenbezogene Daten innerhalb des Dienstes verarbeiten, sind sie für die datenschutzrechtliche Zulässigkeit dieser Verarbeitung verantwortlich, sofern der Anbieter nicht ausdrücklich eine abweichende Rolle übernimmt. Der Nutzer erkennt an, dass zur Bereitstellung der kollaborativen Funktionen ein technischer Datenaustausch zwischen integrierten Fachdiensten des Dienstes erfolgt.</p><p>(4) Inhalte oder Daten können – abhängig von den gewählten Einstellungen oder Funktionen des Dienstes – öffentlich zugänglich gemacht oder als Linked Open Data veröffentlicht werden. Nutzer sind selbst dafür verantwortlich zu prüfen, ob eine Veröffentlichung rechtlich zulässig ist und keine Rechte Dritter, insbesondere Datenschutz-, Urheber- oder Persönlichkeitsrechte, verletzt werden.</p><p>(5) Der Anbieter ist berechtigt, Inhalte zu entfernen oder den Zugriff darauf einzuschränken, sofern konkrete Anhaltspunkte für Rechtsverstöße, Verstöße gegen diese Nutzungsbedingungen oder erhebliche Beeinträchtigungen des Dienstbetriebs vorliegen.</p><p>(6) Eine Verpflichtung zur dauerhaften Speicherung oder Vorhaltung von Inhalten besteht nicht. Nutzer sind für eine eigenständige Sicherung ihrer Daten verantwortlich.</p><p><strong>§ 5 Verfügbarkeit und Änderungen</strong></p><p>(1) Der Dienst wird als wissenschaftliche Forschungsinfrastruktur im Rahmen der verfügbaren technischen und organisatorischen Möglichkeiten bereitgestellt.</p><p>(2) Der Dienst kann experimentellen Charakter haben. Der Anbieter übernimmt keine Gewähr für eine jederzeitige Verfügbarkeit, Fehlerfreiheit oder bestimmte Funktionalitäten des Dienstes.</p><p>(3) Der Anbieter behält sich vor, Funktionen des Dienstes jederzeit zu ändern, einzuschränken oder einzustellen, soweit hierdurch wesentliche Nutzerinteressen nicht unangemessen beeinträchtigt werden.</p><p><strong>§ 6 Haftung</strong></p><p>(1) Der Anbieter haftet unbeschränkt bei Vorsatz und grober Fahrlässigkeit sowie nach Maßgabe zwingender gesetzlicher Vorschriften.</p><p>(2) Bei einfacher Fahrlässigkeit haftet der Anbieter nur bei Verletzung wesentlicher Vertragspflichten (Kardinalpflichten) und beschränkt auf den vorhersehbaren, vertragstypischen Schaden.</p><p>(3) Die Haftung für den Verlust von Daten ist auf den Aufwand beschränkt, der bei ordnungsgemäßer und regelmäßiger Datensicherung durch den Nutzer für die Wiederherstellung der Daten erforderlich gewesen wäre.</p><p>(4) Im Übrigen ist die Haftung ausgeschlossen.</p><p><strong>§ 7 Schlussbestimmungen</strong></p><p>(1) Es gilt das Recht der Bundesrepublik Deutschland unter Ausschluss des UN-Kaufrechts.</p><p>(2) Sofern gesetzlich zulässig, ist Gerichtsstand der Sitz des Anbieters.</p><p>(3) Sollten einzelne Bestimmungen dieser Nutzungsbedingungen ganz oder teilweise unwirksam sein oder werden, bleibt die Wirksamkeit der übrigen Bestimmungen unberührt.</p><p>&nbsp;</p><p>Stand: 01. Juni 2026</p>'
