custom_fields:
  body:
    -
      value: '<p>Diese Erklärung bezieht sich auf die Website <a href="https://manager.scs.sammlungen.io/"><strong>https://manager.scs.sammlungen.io/</strong></a>.</p><p>Wir sind bemüht, unsere Website im Einklang mit den Bestimmungen des Behindertengleichstellungsgesetzes (BGG) sowie der Barrierefreie-Informationstechnik-Verordnung (BITV 2.0) zur Umsetzung der Richtlinie (EU) 2016/2102 barrierefrei zugänglich zu machen.</p><p><strong>Stand der Vereinbarkeit mit den Anforderungen</strong></p><p>Diese Website ist gegenwärtig <strong>nicht barrierefrei</strong>. Eine vollständige Konformität mit den Anforderungen der BITV 2.0 bzw. den Web Content Accessibility Guidelines (WCAG) 2.1 besteht derzeit noch nicht.</p><p><strong>Erstellung dieser Erklärung</strong></p><p>Diese Erklärung wurde am 30.06.2026 erstellt.</p><p><strong>Maßnahmen zur Verbesserung der Barrierefreiheit</strong></p><p>Wir arbeiten kontinuierlich daran, die Zugänglichkeit unserer Website zu verbessern und bestehende Barrieren schrittweise abzubauen.</p><p><strong>Kontakt / Feedback</strong></p><p>Sollten Sie auf Barrieren stoßen oder Hinweise zur Verbesserung der Barrierefreiheit haben, kontaktieren Sie uns gerne unter: <a href="mailto:scs-manager@sammlungen.io">scs-manager@sammlungen.io</a></p>'
      summary: ''
      format: basic_html
      embed_entities: {  }
