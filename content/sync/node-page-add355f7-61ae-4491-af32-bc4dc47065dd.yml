    custom_fields:
      body:
        -
          value: '<p>This statement applies to the website <a href="https://manager.scs.sammlungen.io/"><strong>https://manager.scs.sammlungen.io/</strong></a>.</p><p>We are committed to making our website accessible, in line with applicable accessibility regulations.</p><p><strong>Compliance Status</strong></p><p>This website is currently <strong>not accessible</strong>. It does not yet fully conform to the Web Content Accessibility Guidelines (WCAG) 2.1.</p><p><strong>Preparation of this statement</strong></p><p>This statement was created on 30.06.2026.</p><p><strong>Measures to improve accessibility</strong></p><p>We are actively working to improve the accessibility of our website and to address existing barriers step by step.</p><p><strong>Feedback / Contact</strong></p><p>If you encounter any accessibility barriers or have suggestions for improvement, please contact us at: <a href="mailto:scs-manager@sammlungen.io">scs-manager@sammlungen.io</a></p>'
